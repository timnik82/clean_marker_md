name: Lint and Quality Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests types-PyYAML
          # Attempt to install requirements if they exist, otherwise continue
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run Ruff (Lint)
        run: ruff check --output-format=github --target-version=py310 .
        
      - name: Run Ruff (Format Check)
        run: ruff format --check --target-version=py310 .
        
      - name: Run Mypy (Type Check)
        run: mypy .

  shell-lint:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './'
          severity: warning

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
          # Optional: Fix findings
          # fix: true 
